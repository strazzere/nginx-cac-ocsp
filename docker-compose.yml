services:
  ocsp:
    build:
      context: .
      dockerfile: Dockerfile.ocsp
    image: ocsp
    environment:
      OCSP_HOST: ${OCSP_HOST:-ocsp.penryn.local}
      CAC_HOST: ${CAC_HOST:-cac.penryn.local}
      # Hosts we may contact for AIA urls found in client certs (default: OCSP_HOST,CAC_HOST, `*` for any)
      OCSP_ALLOWED_HOSTS: ${OCSP_ALLOWED_HOSTS:-}
      # Seconds to cache good/revoked verdicts (0 disables). Revocations take this long to be noticed.
      OCSP_CACHE_TTL: ${OCSP_CACHE_TTL:-60}
      OCSP_VERBOSE: ${OCSP_VERBOSE:-}
    healthcheck:
      # Send the responder a real OCSP request (the status of the answer does not matter) and check
      # the proxy port. Never just open and close a connection to 2560: that wedges the
      # single threaded `openssl ocsp` responder.
      test: ["CMD-SHELL", "openssl ocsp -issuer /etc/ocsp/ca.crt -cert /etc/ocsp/ocsp_cert.pem -url http://localhost:2560 -CAfile /etc/ocsp/ca.crt -timeout 3 >/dev/null 2>&1 && python3 -c \"import socket; socket.create_connection(('localhost', 9000), 2)\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      cac:
        aliases:
          - ${OCSP_HOST:-ocsp.penryn.local}

  cac:
    environment:
      DOWNSTREAM_SERVICE: ${DOWNSTREAM_SERVICE:-www.penryn.com}
      OCSP_HOST: ${OCSP_HOST:-ocsp.penryn.local}
      CAC_HOST: ${CAC_HOST:-cac.penryn.local}
    build:
      context: .
      dockerfile: Dockerfile.nginx-cac
    image: nginx-cac
    depends_on:
      ocsp:
        condition: service_healthy
    networks:
      cac:
        aliases:
          - ${CAC_HOST:-cac.penryn.local}
    # nginx's verdict cache; in memory so it is dropped on restart
    tmpfs:
      - /var/cache/nginx
    ports:
      # Loopback only by default; set BIND_ADDR=0.0.0.0 to expose it to your network
      - "${BIND_ADDR:-127.0.0.1}:8443:443"

  # Test-only downstream that echoes the request headers it receives, used by `make test`:
  #   DOWNSTREAM_SERVICE=echo:8080 docker compose --profile test up
  echo:
    profiles: ["test"]
    image: ocsp
    entrypoint: ["python3", "/echo.py"]
    volumes:
      - ./test/echo.py:/echo.py:ro
    depends_on:
      - ocsp
    networks:
      - cac

networks:
  cac:
