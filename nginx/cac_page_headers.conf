# Extra headers for the pages nginx serves itself (not the proxied downstream app,
# which has its own requirements). They contain no scripts, so lock them down fully.
# Must be included after cac_headers.conf in the same location.
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
