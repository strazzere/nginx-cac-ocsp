services:
  ocsp.penryn.local:
    build:
      context: .
      dockerfile: Dockerfile.ocsp
    image: ocsp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 9000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - penryn.local

  cac.penryn.local:
    environment:
      DOWNSTREAM_SERVICE: "www.penryn.com"
    build:
      context: .
      dockerfile: Dockerfile.nginx-cac
    image: nginx-cac
    depends_on:
      ocsp.penryn.local:
        condition: service_healthy
    networks:
      - penryn.local
    ports:
      - "8443:443"

networks:
  penryn.local:
