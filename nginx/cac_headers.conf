# Included in every location that sets headers: add_header in a location
# replaces (rather than adds to) the ones inherited from the server block.
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

# Inform the browser/curl which user connected to this TLS endpoint
add_header X-Subject-DN $ssl_client_s_dn always;
add_header X-Client-Verified $ssl_client_verify always;
add_header X-Client-CN $ssl_client_cn always;
add_header X-OCSP-Status $ocsp_status always;
add_header X-OCSP-Reason $ocsp_reason always;
# Where the verdict came from: the proxy's cache (X-OCSP-Cache), nginx's cache (X-Auth-Cache)
add_header X-OCSP-Cache $ocsp_cache always;
add_header X-Auth-Cache $auth_cache always;
